name: resto-saas

services:
  db:
    image: postgres:16-alpine
    container_name: resto_saas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resto_saas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d resto_saas']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: resto_saas_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/resto_saas
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@db:5432/resto_saas_shadow
      JWT_ACCESS_SECRET: dev_access_secret_change_me_0123456789abcdef
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me_fedcba9876543210
      JWT_REFRESH_TTL: 7d
      ARGON2_MEMORY_COST: 19456
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
      CORS_ORIGIN: http://localhost:5173
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 120
      LOG_LEVEL: log
      SWAGGER_ENABLED: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ../src:/app/src
      - ../prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

volumes:
  pgdata:
