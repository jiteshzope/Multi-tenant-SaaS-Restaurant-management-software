name: resto-saas

services:
  db:
    image: postgres:16-alpine
    container_name: resto_saas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resto_saas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d resto_saas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
